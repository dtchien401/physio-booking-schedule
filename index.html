<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Therapist Booking Platform</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --blue-900: #0b2f8f;
      --blue-800: #0f3ea8;
      --blue-600: #2563eb;
      --blue-400: #38bdf8;
      --blue-300: #7dd3fc;
      --sky-50: #eff6ff;
      --text: #1e293b;
      --muted: #64748b;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(90,167,255,0.9) 0%, rgba(238,246,255,0.95) 32%, #edf7ff 100%);
      color: var(--text);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 30%, rgba(56,189,248,0.22), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(255,255,255,0.65), transparent 24%);
      z-index: -1;
    }

    .app {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    header {
      background:
        linear-gradient(135deg,
          #0b2f8f 0%,
          #2563eb 45%,
          #60a5fa 100%);
      color: white;
      padding: 30px;
      border-radius: 26px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 14px 38px rgba(37,99,235,0.34);
    }

    header::after {
      content: '';
      position: absolute;
      width: 340px;
      height: 340px;
      right: -120px;
      top: -140px;
      border: 1px solid rgba(255,255,255,0.38);
      border-radius: 50%;
      box-shadow:
        0 0 0 20px rgba(255,255,255,0.05),
        0 0 0 42px rgba(255,255,255,0.04),
        0 0 0 66px rgba(255,255,255,0.03);
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 0.4px;
      position: relative;
      z-index: 1;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.92;
      position: relative;
      z-index: 1;
    }

    .badge {
      background: rgba(255,255,255,0.96);
      color: #2563eb;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: bold;
      white-space: nowrap;
      position: relative;
      z-index: 1;
      box-shadow: 0 6px 18px rgba(255,255,255,0.38);
    }

    .filters {
      background: rgba(255,255,255,0.90);
      backdrop-filter: blur(10px);
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(37,99,235,0.08);
      align-items: end;
      border: 1px solid rgba(96,165,250,0.18);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #1e40af;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(96,165,250,0.36);
      border-radius: 14px;
      font-size: 15px;
      background: rgba(255,255,255,0.96);
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56,189,248,0.15);
    }

    button {
      border: none;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: white;
      padding: 13px 18px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37,99,235,0.25);
      transition: 0.22s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .secondary {
      background: linear-gradient(135deg, #64748b, #94a3b8);
    }

    .location-card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 12px 34px rgba(37,99,235,0.08);
      border: 1px solid rgba(96,165,250,0.18);
    }

    .location-card h2 {
      margin: 0 0 18px;
      color: #0f3ea8;
      letter-spacing: 0.4px;
    }

    .therapist-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .therapist-card {
      border: 1px solid rgba(96,165,250,0.25);
      border-radius: 20px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(239,246,255,0.95));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .therapist-card h3 {
      margin: 0 0 4px;
      font-size: 22px;
      color: #0f3ea8;
    }

    .shift {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .slot {
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .available {
      background: linear-gradient(135deg, #dbeafe, #e0f2fe);
      color: #0369a1;
      border: 1px solid rgba(56,189,248,0.28);
    }

    .booked {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: white;
      box-shadow: 0 8px 20px rgba(37,99,235,0.18);
    }

    .off {
      background: #e2e8f0;
      color: #64748b;
    }

    .slot button {
      padding: 8px 14px;
      font-size: 13px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      box-shadow: 0 6px 16px rgba(37,99,235,0.22);
    }

    .booked-info {
      font-size: 13px;
      line-height: 1.5;
      margin-top: 4px;
    }

    .status-pill {
      font-size: 12px;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
      white-space: nowrap;
    }

    .loading {
      background: rgba(255,255,255,0.9);
      padding: 24px;
      border-radius: 18px;
      text-align: center;
      color: #64748b;
      box-shadow: 0 10px 30px rgba(37,99,235,0.08);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.48);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      background: linear-gradient(180deg, #ffffff, #eff6ff);
      width: 100%;
      max-width: 500px;
      border-radius: 26px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 22px 58px rgba(37,99,235,0.20);
      border: 1px solid rgba(96,165,250,0.22);
    }

    .modal-box h2 {
      margin-top: 0;
      color: #0f3ea8;
    }

    .summary {
      background: linear-gradient(135deg, #dbeafe, #e0f2fe);
      color: #1d4ed8;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 16px;
      font-weight: bold;
      line-height: 1.6;
      border: 1px solid rgba(56,189,248,0.22);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;
    }

    .notice {
      margin-top: 10px;
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
      background: rgba(255,255,255,0.55);
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .therapist-grid {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1>Therapist Booking Platform</h1>
        <p>TTC & VVO booking / availability view</p>
      </div>
      <div class="badge">60-min open slots</div>
    </header>

    <section class="filters">
      <div>
        <label>Ngày booking</label>
        <input type="date" id="dateFilter" />
      </div>

      <div>
        <label>Location</label>
        <select id="locationFilter">
          <option value="ALL">All Locations</option>
          <option value="TTC">TTC</option>
          <option value="VVO">VVO</option>
        </select>
      </div>

      <button onclick="loadBookings()">Refresh</button>
    </section>

    <main id="schedule">
      <div class="loading">Loading booking data...</div>
    </main>

    <div class="notice">
      Logic: slot xanh = Available, slot đỏ = Booked, mỗi booking block chuẩn 60 phút.
    </div>
  </div>

  <div class="modal" id="bookingModal">
    <div class="modal-box">
      <h2>New Booking</h2>

      <input type="hidden" id="selectedDate" />
      <input type="hidden" id="selectedTime" />
      <input type="hidden" id="selectedLocation" />
      <input type="hidden" id="selectedTherapist" />

      <div class="summary" id="bookingSummary"></div>

      <div class="form-group">
        <label>Member Name</label>
        <input id="memberName" placeholder="Nhập tên hội viên" />
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input id="phone" placeholder="Nhập số điện thoại" />
      </div>

      <div class="form-group">
        <label>Service</label>
        <select id="service">
          <option value="">Chọn dịch vụ</option>
          <option value="ProPhysio">ProPhysio</option>
          <option value="Recovery">Recovery</option>
          <option value="Consultation">Consultation</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Note</label>
        <textarea id="note" rows="3" placeholder="Ghi chú thêm"></textarea>
      </div>

      <div class="modal-actions">
        <button class="secondary" onclick="closeModal()">Cancel</button>
        <button onclick="submitBooking()">Confirm Booking</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxMjiFBsMsJxKWWIhRtYinZEAIpwOuBlkyEZayWRcVo7_2qmRjN2phCBr1MiBAga_wBcg/exec';

    const therapists = [
      {
        location: 'TTC',
        name: 'Đan',
        shift: 'Ca sáng',
        start: '10:00',
        end: '15:00',
        workingDays: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
      },
      {
        location: 'TTC',
        name: 'Phương',
        shift: 'Ca chiều',
        start: '15:00',
        end: '19:00',
        workingDays: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sun']
      },
      {
        location: 'VVO',
        name: 'Thạch',
        shift: 'Ca sáng',
        start: '10:00',
        end: '15:00',
        workingDays: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
      },
      {
        location: 'VVO',
        name: 'Duyên',
        shift: 'Ca chiều',
        start: '15:00',
        end: '19:00',
        workingDays: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sun']
      }
    ];

    let bookings = [];

    document.addEventListener('DOMContentLoaded', function () {
      const today = new Date();
      document.getElementById('dateFilter').value = today.toISOString().split('T')[0];

      document.getElementById('dateFilter').addEventListener('change', renderSchedule);
      document.getElementById('locationFilter').addEventListener('change', renderSchedule);

      loadBookings();
    });

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        const callback = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);

        window[callback] = function(data) {
          resolve(data);
          delete window[callback];
          script.remove();
        };

        const script = document.createElement('script');
        const separator = url.includes('?') ? '&' : '?';
        script.src = url + separator + 'callback=' + callback;
        script.onerror = function() {
          reject(new Error('Cannot connect to Google Apps Script API'));
        };

        document.body.appendChild(script);
      });
    }

    async function loadBookings() {
      const schedule = document.getElementById('schedule');
      schedule.innerHTML = '<div class="loading">Loading booking data...</div>';

      try {
        const res = await jsonp(API_URL + '?action=list');

        if (res.success) {
          bookings = res.bookings || [];
          renderSchedule();
        } else {
          schedule.innerHTML = '<div class="loading">Error: ' + (res.message || 'Cannot load bookings') + '</div>';
        }
      } catch (err) {
        schedule.innerHTML = '<div class="loading">Cannot connect to API. Please check Apps Script deployment.</div>';
      }
    }

    function renderSchedule() {
      const date = document.getElementById('dateFilter').value;
      const locationFilter = document.getElementById('locationFilter').value;
      const schedule = document.getElementById('schedule');

      schedule.innerHTML = '';

      const locations = locationFilter === 'ALL' ? ['TTC', 'VVO'] : [locationFilter];

      locations.forEach(function(location) {
        const locationTherapists = therapists.filter(function(t) {
          return t.location === location;
        });

        const card = document.createElement('section');
        card.className = 'location-card';

        card.innerHTML = `
          <h2>${location}</h2>
          <div class="therapist-grid">
            ${locationTherapists.map(function(t) {
              return renderTherapist(t, date);
            }).join('')}
          </div>
        `;

        schedule.appendChild(card);
      });
    }

    function renderTherapist(t, date) {
      const day = getDayName(date);
      const isWorking = t.workingDays.includes(day);

      if (!isWorking) {
        return `
          <div class="therapist-card">
            <h3>${t.name}</h3>
            <div class="shift">${t.shift} | Off day</div>
            <div class="slot off">
              <strong>Off</strong>
              <span class="status-pill">Not Available</span>
            </div>
          </div>
        `;
      }

      const slots = generateSlots(t.start, t.end);

      return `
        <div class="therapist-card">
          <h3>${t.name}</h3>
          <div class="shift">${t.shift} | ${t.start} - ${t.end}</div>
          ${slots.map(function(slot) {
            return renderSlot(t, date, slot);
          }).join('')}
        </div>
      `;
    }

    function renderSlot(t, date, slot) {
      const booking = bookings.find(function(b) {
        return normalizeDate(b.date) === date &&
          b.time === slot &&
          b.location === t.location &&
          b.therapist === t.name &&
          b.status !== 'Cancelled';
      });

      if (booking) {
        return `
          <div class="slot booked">
            <div>
              <strong>${slot}</strong>
              <div class="booked-info">
                ${booking.memberName || 'Booked'}<br>
                ${booking.phone || ''}<br>
                ${booking.service || ''}
              </div>
            </div>
            <span class="status-pill">Booked</span>
          </div>
        `;
      }

      return `
        <div class="slot available">
          <strong>${slot}</strong>
          <button onclick="openBookingModal('${date}', '${slot}', '${t.location}', '${t.name}')">
            Book
          </button>
        </div>
      `;
    }

    function generateSlots(start, end) {
      const slots = [];

      let startHour = parseInt(start.split(':')[0], 10);
      const endHour = parseInt(end.split(':')[0], 10);

      while (startHour < endHour) {

        // Ca sáng nghỉ trưa từ 12:00 đến 13:00
        // Vì vậy hệ thống không tạo slot 12:00-13:00
        if (startHour === 12) {
          startHour++;
          continue;
        }

        const from = String(startHour).padStart(2, '0') + ':00';
        const to = String(startHour + 1).padStart(2, '0') + ':00';
        slots.push(from + '-' + to);
        startHour++;
      }

      return slots;
    }

    function getDayName(dateString) {
      const parts = dateString.split('-');
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      const dayIndex = date.getDay();
      return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dayIndex];
    }

    function normalizeDate(value) {
      if (!value) return '';

      if (typeof value === 'string') {
        if (value.includes('T')) {
          return value.split('T')[0];
        }
        return value;
      }

      try {
        return new Date(value).toISOString().split('T')[0];
      } catch (e) {
        return value;
      }
    }

    function openBookingModal(date, time, location, therapist) {
      document.getElementById('selectedDate').value = date;
      document.getElementById('selectedTime').value = time;
      document.getElementById('selectedLocation').value = location;
      document.getElementById('selectedTherapist').value = therapist;

      document.getElementById('bookingSummary').innerText =
        'Date: ' + date + '\\n' +
        'Time: ' + time + '\\n' +
        'Location: ' + location + '\\n' +
        'Therapist: ' + therapist;

      document.getElementById('bookingModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('bookingModal').style.display = 'none';
    }

    async function submitBooking() {
      const memberName = document.getElementById('memberName').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!memberName) {
        alert('Vui lòng nhập tên hội viên.');
        return;
      }

      if (!phone) {
        alert('Vui lòng nhập số điện thoại.');
        return;
      }

      const params = new URLSearchParams({
        action: 'book',
        date: document.getElementById('selectedDate').value,
        time: document.getElementById('selectedTime').value,
        location: document.getElementById('selectedLocation').value,
        therapist: document.getElementById('selectedTherapist').value,
        memberName: memberName,
        phone: phone,
        service: document.getElementById('service').value,
        note: document.getElementById('note').value
      });

      try {
        const res = await jsonp(API_URL + '?' + params.toString());

        alert(res.message || 'Done');

        if (res.success) {
          closeModal();
          clearForm();
          loadBookings();
        }
      } catch (err) {
        alert('Không gửi được booking. Vui lòng kiểm tra API.');
      }
    }

    function clearForm() {
      document.getElementById('memberName').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('service').value = '';
      document.getElementById('note').value = '';
    }
  </script>
</body>
</html>
