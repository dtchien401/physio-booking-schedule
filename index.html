<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Lịch Đặt Hẹn ProPhysio</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --blue-900: #0b2f8f;
      --blue-800: #0f3ea8;
      --blue-600: #2563eb;
      --blue-400: #38bdf8;
      --text: #1e293b;
      --muted: #64748b;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top left, #ffffff 0%, #eef7ff 38%, #dff1ff 100%);
      color: var(--text);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 30%, rgba(56,189,248,0.22), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(255,255,255,0.65), transparent 24%);
      z-index: -1;
    }

    .app {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, #ffffff 0%, #eef7ff 45%, #d8efff 100%);
      color: #0b2f8f;
      padding: 30px;
      border-radius: 26px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 14px 38px rgba(37,99,235,0.16);
      border: 1px solid rgba(0,132,255,0.16);
    }

    header::after {
      content: '';
      position: absolute;
      width: 360px;
      height: 360px;
      right: -120px;
      top: -150px;
      border: 1px solid rgba(0,132,255,0.24);
      border-radius: 50%;
      box-shadow:
        0 0 0 20px rgba(0,132,255,0.06),
        0 0 0 42px rgba(0,132,255,0.04),
        0 0 0 66px rgba(0,132,255,0.025);
    }



    .brand-block {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .brand-logo {
      width: 260px;
      max-width: 72vw;
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 18px rgba(0,132,255,0.16));
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 0.4px;
      position: relative;
      z-index: 1;
    }

    header p {
      margin: 8px 0 0;
      color: #475569;
      opacity: 0.96;
      position: relative;
      z-index: 1;
    }

    .badge {
      background: linear-gradient(135deg, #0084ff, #38bdf8);
      color: white;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: bold;
      white-space: nowrap;
      position: relative;
      z-index: 1;
      box-shadow: 0 8px 22px rgba(0,132,255,0.24);
    }

    .filters {
      background: rgba(255,255,255,0.90);
      backdrop-filter: blur(10px);
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(37,99,235,0.08);
      align-items: end;
      border: 1px solid rgba(96,165,250,0.18);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #1e40af;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(96,165,250,0.36);
      border-radius: 14px;
      font-size: 15px;
      background: rgba(255,255,255,0.96);
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56,189,248,0.15);
    }

    button {
      border: none;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: white;
      padding: 13px 18px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37,99,235,0.25);
      transition: 0.22s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .secondary {
      background: linear-gradient(135deg, #64748b, #94a3b8);
    }

    .location-card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 12px 34px rgba(37,99,235,0.08);
      border: 1px solid rgba(96,165,250,0.18);
    }

    .location-card h2 {
      margin: 0 0 18px;
      color: #0f3ea8;
      letter-spacing: 0.4px;
    }

    .therapist-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .therapist-card {
      border: 1px solid rgba(96,165,250,0.25);
      border-radius: 20px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(239,246,255,0.95));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .therapist-card h3 {
      margin: 0 0 4px;
      font-size: 22px;
      color: #0f3ea8;
    }

    .shift {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .slot {
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .available {
      background: linear-gradient(135deg, #dbeafe, #e0f2fe);
      color: #0369a1;
      border: 1px solid rgba(56,189,248,0.28);
    }

    .booked {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: white;
      box-shadow: 0 8px 20px rgba(37,99,235,0.18);
    }

    .closed {
      background: #cbd5e1;
      color: #475569;
      opacity: 0.78;
    }

    .off {
      background: #e2e8f0;
      color: #64748b;
    }

    .slot button {
      padding: 8px 14px;
      font-size: 13px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      box-shadow: 0 6px 16px rgba(37,99,235,0.22);
    }

    .booked-info {
      font-size: 13px;
      line-height: 1.5;
      margin-top: 4px;
      max-width: 100%;
      word-break: break-word;
    }

    .booked-name {
      font-weight: bold;
      font-size: 14px;
    }

    .booked-note {
      margin-top: 3px;
      opacity: 0.95;
    }

    .contract-box {
      margin-top: 8px;
      padding: 9px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.28);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      max-width: 360px;
    }

    .contract-metric {
      background: rgba(255,255,255,0.22);
      border-radius: 12px;
      padding: 7px 8px;
      text-align: center;
      line-height: 1.2;
    }

    .contract-metric span {
      display: block;
      font-size: 11px;
      opacity: 0.92;
      margin-bottom: 3px;
    }

    .contract-metric strong {
      font-size: 15px;
      color: #fff;
    }

    .contract-warning {
      margin-top: 8px;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.28);
    }

    .status-pill {
      font-size: 12px;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
      white-space: nowrap;
    }

    .loading, .empty {
      background: rgba(255,255,255,0.9);
      padding: 24px;
      border-radius: 18px;
      text-align: center;
      color: #64748b;
      box-shadow: 0 10px 30px rgba(37,99,235,0.08);
    }

    .empty strong {
      color: #0f3ea8;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.48);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      background: linear-gradient(180deg, #ffffff, #eff6ff);
      width: 100%;
      max-width: 500px;
      border-radius: 26px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 22px 58px rgba(37,99,235,0.20);
      border: 1px solid rgba(96,165,250,0.22);
    }

    .modal-box h2 {
      margin-top: 0;
      color: #0f3ea8;
    }

    .summary {
      background: linear-gradient(135deg, #dbeafe, #e0f2fe);
      color: #1d4ed8;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 16px;
      font-weight: bold;
      line-height: 1.6;
      border: 1px solid rgba(56,189,248,0.22);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;
    }

    .notice {
      margin-top: 10px;
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
      background: rgba(255,255,255,0.55);
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .brand-logo {
        width: 220px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .therapist-grid {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand-block">
        <img class="brand-logo" src="logo.png" alt="California ProPhysio" />
        <div>
          <h1>Lịch Đặt Hẹn ProPhysio</h1>
          <p>Theo dõi lịch trống và lịch đã đặt tại TTC & VVO</p>
        </div>
      </div>
      <div class="badge">Mỗi slot 60 phút</div>
    </header>

    <section class="filters">
      <div>
        <label>Ngày đặt lịch</label>
        <input type="date" id="dateFilter" />
      </div>

      <div>
        <label>Địa điểm</label>
        <select id="locationFilter">
          <option value="ALL">Tất cả địa điểm</option>
        </select>
      </div>

      <button onclick="loadData()">Làm mới</button>
    </section>

    <main id="schedule">
      <div class="loading">Đang tải dữ liệu đặt lịch...</div>
    </main>

    <div class="notice">
      Slot xanh nhạt = còn trống, xanh đậm = đã đặt, xám = đã qua giờ. Khi đã đặt, hệ thống map SĐT với sheet contract để hiện Gói / Đã dùng / Còn lại.
    </div>
  </div>

  <div class="modal" id="bookingModal">
    <div class="modal-box">
      <h2>Tạo lịch đặt hẹn</h2>

      <input type="hidden" id="selectedDate" />
      <input type="hidden" id="selectedTime" />
      <input type="hidden" id="selectedLocation" />
      <input type="hidden" id="selectedTherapist" />

      <div class="summary" id="bookingSummary"></div>

      <div class="form-group">
        <label>Tên hội viên</label>
        <input id="memberName" placeholder="Nhập tên hội viên" />
      </div>

      <div class="form-group">
        <label>Số điện thoại</label>
        <input id="phone" placeholder="Nhập số điện thoại" />
      </div>

      <div class="form-group">
        <label>Ghi chú</label>
        <textarea id="note" rows="3" placeholder="Ghi chú thêm nếu có"></textarea>
      </div>

      <div class="modal-actions">
        <button class="secondary" onclick="closeModal()">Huỷ</button>
        <button onclick="submitBooking()">Xác nhận đặt lịch</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyiGNR2_EcXLLvwSU16T2-o2ibxRIElMza_JYr5xokGEnUNeia1W6VpOXJ4VUiDBW4Alg/exec';

    // contract.csv is stored in the same GitHub Pages repo as this index.html.
    // If you open the HTML locally, fallbackRawUrl will still help during testing.
    const CONTRACT_CSV_URL = 'contract.csv';
    const CONTRACT_CSV_FALLBACK_URL = 'https://raw.githubusercontent.com/dtchien401/physio-booking-schedule/main/contract.csv';

    let bookings = [];
    let scheduleRows = [];
    let contracts = [];

    document.addEventListener('DOMContentLoaded', function () {
      const today = new Date();
      document.getElementById('dateFilter').value = today.toISOString().split('T')[0];

      document.getElementById('dateFilter').addEventListener('change', loadData);
      document.getElementById('locationFilter').addEventListener('change', renderSchedule);

      loadData();
    });

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        const callback = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);

        window[callback] = function(data) {
          resolve(data);
          delete window[callback];
          script.remove();
        };

        const script = document.createElement('script');
        const separator = url.includes('?') ? '&' : '?';
        script.src = url + separator + 'callback=' + callback;
        script.onerror = function() {
          reject(new Error('Không thể kết nối API Google Apps Script'));
        };

        document.body.appendChild(script);
      });
    }


    async function loadContractsFromCSV() {
      try {
        const csvText = await fetchCSVText(CONTRACT_CSV_URL);
        const rows = parseCSV(csvText);
        console.log('Loaded contract.csv from same repo:', rows.length);
        return rows;
      } catch (err) {
        console.warn('Cannot load local contract.csv, trying fallback raw GitHub URL:', err.message);
      }

      try {
        const csvText = await fetchCSVText(CONTRACT_CSV_FALLBACK_URL);
        const rows = parseCSV(csvText);
        console.log('Loaded contract.csv from fallback raw GitHub:', rows.length);
        return rows;
      } catch (err) {
        console.warn('Cannot load contract.csv:', err.message);
        return [];
      }
    }

    async function fetchCSVText(url) {
      const response = await fetch(url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now(), {
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error('HTTP ' + response.status + ' when loading ' + url);
      }

      return await response.text();
    }

    function parseCSV(csvText) {
      const text = String(csvText || '').replace(/^\uFEFF/, '');
      const rows = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (char === ',' && !inQuotes) {
          row.push(cell);
          cell = '';
          continue;
        }

        if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(cell);
          rows.push(row);
          row = [];
          cell = '';
          continue;
        }

        cell += char;
      }

      if (cell !== '' || row.length) {
        row.push(cell);
        rows.push(row);
      }

      if (!rows.length) return [];

      const headers = rows[0].map(h => cleanText(h).replace(/^\uFEFF/, ''));

      return rows.slice(1)
        .filter(r => r.some(c => String(c || '').trim() !== ''))
        .map(r => {
          const obj = {};
          headers.forEach((h, i) => {
            obj[h] = r[i] === undefined ? '' : r[i];
          });
          return obj;
        });
    }

    async function loadData() {
      const date = document.getElementById('dateFilter').value;
      const container = document.getElementById('schedule');

      container.innerHTML = '<div class="loading">Đang tải dữ liệu đặt lịch...</div>';

      try {
        const res = await jsonp(API_URL + '?action=list&date=' + encodeURIComponent(date) + '&v=' + Date.now());

        if (!res.success) {
          container.innerHTML = '<div class="loading">Lỗi: ' + (res.message || 'Không tải được dữ liệu') + '</div>';
          return;
        }

        bookings = res.bookings || [];
        scheduleRows = res.schedule || [];

        // Prefer contracts returned by Apps Script if available.
        // If not available, read contract.csv directly from GitHub Pages.
        contracts = res.contracts || res.contract || [];
        if (!contracts.length) {
          contracts = await loadContractsFromCSV();
        }

        console.log('Loaded bookings:', bookings.length);
        console.log('Loaded schedule rows:', scheduleRows.length);
        console.log('Loaded contracts:', contracts.length);

        updateLocationFilter();
        renderSchedule();

      } catch (err) {
        container.innerHTML = '<div class="loading">Không kết nối được API. Vui lòng kiểm tra lại phần Deploy của Apps Script.</div>';
      }
    }

    function updateLocationFilter() {
      const select = document.getElementById('locationFilter');
      const current = select.value;

      const locations = Array.from(new Set(scheduleRows.map(r => cleanText(r.location)).filter(Boolean)));

      select.innerHTML = '<option value="ALL">Tất cả địa điểm</option>';

      locations.forEach(function(loc) {
        const option = document.createElement('option');
        option.value = loc;
        option.textContent = loc;
        select.appendChild(option);
      });

      if (locations.includes(current)) {
        select.value = current;
      } else {
        select.value = 'ALL';
      }
    }

    function renderSchedule() {
      const date = document.getElementById('dateFilter').value;
      const locationFilter = document.getElementById('locationFilter').value;
      const container = document.getElementById('schedule');

      container.innerHTML = '';

      if (!scheduleRows.length) {
        container.innerHTML = `
          <div class="empty">
            <strong>Chưa có lịch làm việc cho ngày ${date}.</strong><br>
            Vui lòng cập nhật tab SCHEDULE trong Google Sheet.
          </div>
        `;
        return;
      }

      const filtered = locationFilter === 'ALL'
        ? scheduleRows
        : scheduleRows.filter(r => cleanText(r.location) === cleanText(locationFilter));

      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty">
            <strong>Không có lịch tại địa điểm này.</strong><br>
            Vui lòng chọn địa điểm khác hoặc cập nhật SCHEDULE.
          </div>
        `;
        return;
      }

      const locations = Array.from(new Set(filtered.map(r => cleanText(r.location))));

      locations.forEach(function(location) {
        const rows = filtered.filter(r => cleanText(r.location) === cleanText(location));

        const card = document.createElement('section');
        card.className = 'location-card';

        card.innerHTML = `
          <h2>${location}</h2>
          <div class="therapist-grid">
            ${rows.map(function(row) {
              return renderTherapist(row, date);
            }).join('')}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function renderTherapist(row, date) {
      const slots = generateSlots(row.start, row.end, row.lunchBreak);

      return `
        <div class="therapist-card">
          <h3>${row.therapist}</h3>
          <div class="shift">${row.note || 'Lịch làm việc'} | ${row.start} - ${row.end}</div>
          ${slots.map(function(slot) {
            return renderSlot(row, date, slot);
          }).join('')}
        </div>
      `;
    }

    function renderSlot(row, date, slot) {
      const booking = bookings.find(function(b) {
        return normalizeDate(b.date) === date &&
          cleanTime(b.time) === cleanTime(slot) &&
          cleanText(b.location) === cleanText(row.location) &&
          cleanText(b.therapist) === cleanText(row.therapist) &&
          cleanText(b.status).toLowerCase() !== 'cancelled';
      });

      const isPast = isPastSlot(date, slot);

      if (booking) {
        const contract = findContractByPhone(booking.phone);
        const contractHtml = renderContractInfo(contract, booking.phone);

        return `
          <div class="slot booked">
            <div>
              <strong>${slot}</strong>
              <div class="booked-info">
                <div class="booked-name">${escapeHtml(booking.memberName || contract?.memberName || 'Đã đặt lịch')}</div>
                <div>${booking.phone ? '📞 ' + escapeHtml(booking.phone) : ''}</div>
                ${contractHtml}
                ${booking.note ? '<div class="booked-note">📝 ' + escapeHtml(booking.note) + '</div>' : ''}
              </div>
            </div>
            <span class="status-pill">Đã đặt</span>
          </div>
        `;
      }

      if (isPast) {
        return `
          <div class="slot closed">
            <strong>${slot}</strong>
            <span class="status-pill">Đã qua</span>
          </div>
        `;
      }

      return `
        <div class="slot available">
          <strong>${slot}</strong>
          <button onclick="openBookingModal('${date}', '${slot}', '${row.location}', '${row.therapist}')">
            Đặt lịch
          </button>
        </div>
      `;
    }

    function generateSlots(start, end, lunchBreak) {
      const slots = [];

      let startHour = Number(start.split(':')[0]);
      const endHour = Number(end.split(':')[0]);

      const lunch = cleanTime(lunchBreak || '');

      while (startHour < endHour) {
        const from = String(startHour).padStart(2, '0') + ':00';
        const to = String(startHour + 1).padStart(2, '0') + ':00';
        const slot = from + '-' + to;

        if (lunch && cleanTime(slot) === lunch) {
          startHour++;
          continue;
        }

        slots.push(slot);
        startHour++;
      }

      return slots;
    }

    function normalizePhone(phone) {
      let p = String(phone || '').replace(/\D/g, '');

      // Map by last 9 digits so these formats still match:
      // 0903312168, +84903312168, 84903312168, 903312168, 0903 312 168
      if (p.startsWith('84') && p.length >= 11) {
        p = p.slice(2);
      }

      return p.slice(-9);
    }

    function pickValue(obj, keys, fallback) {
      if (!obj) return fallback || '';

      for (const key of keys) {
        if (obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== '') {
          return obj[key];
        }
      }

      return fallback || '';
    }

    function toNumber(value) {
      const n = Number(String(value || '0').replace(/,/g, '').trim());
      return isNaN(n) ? 0 : n;
    }

    function normalizeContract(raw) {
      if (!raw) return null;

      // Ưu tiên đúng tên cột từ sheet contract / API:
      // Service Quantity, used, Service Remain
      const total = toNumber(
        pickValue(raw, [
          'Service Quantity',
          'serviceQuantity',
          'totalSessions',
          'quantity'
        ], 0)
      );

      const used = toNumber(
        pickValue(raw, [
          'used',
          'Used',
          'usedSessions'
        ], 0)
      );

      const remain = toNumber(
        pickValue(raw, [
          'Service Remain',
          'remainingSessions',
          'serviceRemain',
          'remain'
        ], 0)
      );

      return {
        phone: pickValue(raw, [
          'Phone number',
          'Phone Number',
          'phone',
          'phoneNumber'
        ], ''),

        memberName: pickValue(raw, [
          'Full Name (S + G) (Client) (Client)',
          'Full Name',
          'memberName',
          'name'
        ], ''),

        contractNumber: pickValue(raw, [
          'Contract Number',
          'contractNumber'
        ], ''),

        totalSessions: total,
        usedSessions: used,
        remainingSessions: remain,

        status: pickValue(raw, [
          'Payment Status',
          'status'
        ], '')
      };
    }

    function findContractByPhone(phone) {
      const targetPhone = normalizePhone(phone);
      if (!targetPhone) return null;

      const activeContracts = (contracts || [])
        .map(normalizeContract)
        .filter(Boolean)
        .filter(c => {
          const contractPhone = normalizePhone(c.phone);
          return contractPhone && (
            contractPhone === targetPhone ||
            contractPhone.endsWith(targetPhone) ||
            targetPhone.endsWith(contractPhone)
          );
        });

      console.log('BOOKING PHONE MAP:', phone, '=>', targetPhone, 'MATCHES:', activeContracts);

      if (!activeContracts.length) return null;

      // If a client has multiple contracts, show the one with remaining sessions first.
      activeContracts.sort((a, b) => b.remainingSessions - a.remainingSessions);
      return activeContracts[0];
    }

    function renderContractInfo(contract, phone) {
      if (!phone) return '';

      if (!contract) {
        return '<div class="contract-warning">⚠️ Chưa tìm thấy hợp đồng theo SĐT</div>';
      }

      return `
        <div class="contract-box" title="${escapeHtml(contract.contractNumber || '')}">
          <div class="contract-metric">
            <span>Gói</span>
            <strong>${escapeHtml(contract.totalSessions)}</strong>
          </div>
          <div class="contract-metric">
            <span>Đã dùng</span>
            <strong>${escapeHtml(contract.usedSessions)}</strong>
          </div>
          <div class="contract-metric">
            <span>Còn lại</span>
            <strong>${escapeHtml(contract.remainingSessions)}</strong>
          </div>
        </div>
      `;
    }

    function normalizeDate(value) {
      if (!value) return '';

      const text = String(value).trim();

      // yyyy-mm-dd
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;

      // ISO date from API
      if (text.includes('T')) return text.split('T')[0];

      // dd/MM/yyyy or d/M/yyyy from Google Sheet / browser display
      const dmy = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (dmy) {
        const day = dmy[1].padStart(2, '0');
        const month = dmy[2].padStart(2, '0');
        const year = dmy[3];
        return `${year}-${month}-${day}`;
      }

      const parsed = new Date(text);
      if (!isNaN(parsed.getTime())) return parsed.toISOString().split('T')[0];

      return text;
    }

    function cleanText(value) {
      return String(value || '').trim().replace(/\s+/g, ' ').normalize('NFC');
    }

    function cleanTime(value) {
      return String(value || '')
        .trim()
        .replace(/\s+/g, '')
        .replace(/–/g, '-')
        .replace(/—/g, '-')
        .normalize('NFC');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function isPastSlot(date, slot) {
      const now = new Date();

      const parts = date.split('-');
      const selectedDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      if (selectedDate < today) return true;
      if (selectedDate > today) return false;

      const slotStart = slot.split('-')[0];
      const hour = Number(slotStart.split(':')[0]);
      const minute = Number(slotStart.split(':')[1]);

      const slotDateTime = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        hour,
        minute,
        0
      );

      return slotDateTime < now;
    }

    function openBookingModal(date, time, location, therapist) {
      document.getElementById('selectedDate').value = date;
      document.getElementById('selectedTime').value = time;
      document.getElementById('selectedLocation').value = location;
      document.getElementById('selectedTherapist').value = therapist;

      document.getElementById('bookingSummary').innerText =
        'Ngày: ' + date + '\n' +
        'Giờ: ' + time + '\n' +
        'Địa điểm: ' + location + '\n' +
        'KTV: ' + therapist;

      document.getElementById('bookingModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('bookingModal').style.display = 'none';
    }

    async function submitBooking() {
      const memberName = document.getElementById('memberName').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!memberName) {
        alert('Vui lòng nhập tên hội viên.');
        return;
      }

      if (!phone) {
        alert('Vui lòng nhập số điện thoại.');
        return;
      }

      const params = new URLSearchParams({
        action: 'book',
        date: document.getElementById('selectedDate').value,
        time: document.getElementById('selectedTime').value,
        location: document.getElementById('selectedLocation').value,
        therapist: document.getElementById('selectedTherapist').value,
        memberName: memberName,
        phone: phone,
        service: '',
        note: document.getElementById('note').value
      });

      try {
        const res = await jsonp(API_URL + '?' + params.toString() + '&v=' + Date.now());

        alert(res.message || 'Đã xử lý xong.');

        if (res.success) {
          closeModal();
          clearForm();
          await loadData();
        }
      } catch (err) {
        alert('Không gửi được booking. Vui lòng kiểm tra API.');
      }
    }

    function clearForm() {
      document.getElementById('memberName').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('note').value = '';
    }
  </script>
